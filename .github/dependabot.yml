version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    commit-message:
      prefix: "deps"

    labels:
      - "dependencies"

    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

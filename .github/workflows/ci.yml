name: MusicPlayer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: 🎧 Check if Ava broke MusicPlayer
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔤 Ask TypeScript if everything makes sense
        run: npm run type-check

      - name: 🧹 Judge the code
        run: npm run lint

      - name: 🏗️ Build the thing
        run: npm run build

      - name: 💀 Report failure
        if: failure()
        run: |
          echo "💀 MusicPlayer CI has encountered a problem."
          echo "Ava has been notified."
          echo "Someone probably broke something."
